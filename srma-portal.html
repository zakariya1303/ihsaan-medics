<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SRMA Student Portal — IHSAAN Medics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --white:#FFFFFF;
      --ink:#1A1A1A;
      --primary:#1B6B6B;
      --mid-teal:#3B8D8D;
      --light-teal:#E8F4F4;
      --light-grey:#F5F5F5;
      --dark:#091926;
      --accent:#1B6B6B;
      --amber:#F5A623;
      --muted:rgba(26,26,26,.68);
      --b:#1B6B6B;
    }
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 420px at 10% 0%, rgba(27,107,107,.10), transparent 60%),
        radial-gradient(700px 320px at 90% 10%, rgba(168,212,212,.16), transparent 55%),
        linear-gradient(180deg, #ffffff 0%, #f5f5f5 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    h1,h2,h3,h4,h5,h6{font-family:'Poppins',sans-serif;letter-spacing:-.02em}
    .btn{font-family:'Poppins',sans-serif}
    .portal-wrap{width:100%;max-width:1240px;margin:0 auto;position:relative;z-index:1}
    .portal-wrap.is-dashboard-shell{max-width:none;width:100vw;margin:0;overflow-x:hidden}
    .portal-footer-note,.muted,.help-text,.login-help{color:var(--muted)}
    .sidebar-section{margin-top:12px;padding-top:12px;border-top:1px solid rgba(27,107,107,.10)}
    .sidebar-section:first-of-type{margin-top:0;padding-top:0;border-top:none}
    .sidebar-heading{font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
    .sidebar-links{display:flex;flex-direction:column;gap:6px}
    .sidebar-links a,.phase-switcher button{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(27,107,107,.08);
      background:#fff;color:var(--ink);font-weight:800;font-size:.88rem;line-height:1.2;transition:background .15s ease,border-color .15s ease,transform .15s ease,box-shadow .15s ease,color .15s ease;
    }
    .phase-switcher button{flex-direction:column;align-items:flex-start;gap:4px;justify-content:flex-start}
    .phase-switcher button span:first-child{font-size:.84rem;font-weight:900}
    .phase-switcher button span:last-child{font-size:.74rem;font-weight:600;color:var(--muted)}
    .sidebar-links a:hover,.phase-switcher button:hover{transform:translateY(-1px);border-color:rgba(27,107,107,.18);box-shadow:0 8px 16px rgba(27,107,107,.08)}
    .sidebar-links a.is-active,.phase-switcher button.is-active{background:linear-gradient(180deg, rgba(27,107,107,.12), rgba(27,107,107,.06));border-color:rgba(27,107,107,.22);color:#174f39;box-shadow:0 10px 18px rgba(27,107,107,.10)}
    .phase-switcher{display:flex;flex-direction:column;gap:6px}
    .phase1-nav{display:flex;flex-direction:column;gap:6px}
    .phase1-nav-item{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(27,107,107,.08);background:#fff;text-align:left;transition:background .15s ease,border-color .15s ease,transform .15s ease,box-shadow .15s ease,color .15s ease}
    .phase1-nav-item:hover{transform:translateY(-1px);background:rgba(27,107,107,.04);border-color:rgba(27,107,107,.18);box-shadow:0 8px 16px rgba(27,107,107,.08)}
    .phase1-nav-item.is-active{background:linear-gradient(180deg, rgba(27,107,107,.14), rgba(27,107,107,.08));color:#174f39;border-color:rgba(27,107,107,.24);box-shadow:0 10px 20px rgba(27,107,107,.10)}
    .phase1-nav-page{display:inline-flex;align-items:center;min-width:2.6rem;padding:3px 8px;border-radius:999px;background:rgba(27,107,107,.10);color:#174f39;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .phase1-nav-item.is-active .phase1-nav-page{background:#174f39;color:#fff}
    .phase1-nav-title{display:block;font-weight:700;line-height:1.25;font-size:.88rem}
    .phase1-nav-item.is-active .phase1-nav-title{color:#174f39}
    .phase1-nav-badge{display:none}
    .phase1-page-header{display:flex;flex-direction:column;gap:12px}
    .phase1-banner{background:linear-gradient(180deg, #174f39, #0f3828);border:1px solid rgba(255,255,255,.10);border-radius:22px;padding:18px 20px;box-shadow:0 20px 50px rgba(15,56,40,.24);color:var(--white)}
    .phase1-banner-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .phase1-banner-kicker{font-size:.74rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.78)}
    .phase1-banner-title{margin-top:6px;font-size:clamp(1.45rem,2.2vw,2rem);font-weight:900;line-height:1.15}
    .phase1-banner-meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
    .phase1-banner-pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.10);color:rgba(255,255,255,.94);font-size:.76rem;font-weight:700}
    .phase1-page{display:flex;flex-direction:column;gap:18px}
    .phase1-section-card{padding:18px;border-radius:20px;background:rgba(255,255,255,.96);border:1px solid rgba(27,107,107,.08);box-shadow:0 14px 34px rgba(26,26,26,.05)}
    .phase1-section-card h2,.phase1-section-card h3{margin-top:0}
    .phase1-callout{padding:16px;border-radius:16px;background:linear-gradient(180deg, rgba(27,107,107,.08), rgba(255,255,255,.96));border:1px solid rgba(27,107,107,.12)}
    .phase1-callout.is-amber{background:linear-gradient(180deg, rgba(245,166,35,.14), rgba(255,255,255,.96));border-color:rgba(245,166,35,.18)}
    .phase1-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .phase1-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .phase1-step-card,.phase1-resource-card,.phase1-timeline-card{padding:16px;border-radius:18px;background:rgba(255,255,255,.96);border:1px solid rgba(27,107,107,.08);box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-step-num{font-size:.76rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
    .phase1-resource-card h3,.phase1-timeline-card h3,.phase1-step-card h3{margin:0 0 8px 0}
    .phase1-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:14px;border:1px solid rgba(27,107,107,.10)}
    .phase1-table th,.phase1-table td{padding:12px 12px;text-align:left;vertical-align:top;border-bottom:1px solid rgba(27,107,107,.08)}
    .phase1-table th{background:rgba(27,107,107,.08);color:var(--accent);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
    .phase1-table tr:last-child td{border-bottom:none}
    .phase1-table--srma thead th{background:#174f39;color:#fff;font-size:.82rem;letter-spacing:.08em;text-transform:none}
    .phase1-table--srma tbody td{background:#fff;color:var(--ink)}
    .phase1-table--srma tbody td:first-child{color:#174f39;font-weight:700;width:28%}
    .phase1-table--srma tbody td:nth-child(2){color:#111}
    .phase1-table--srma tbody tr:last-child td{border-bottom:none}
    .phase1-section-title{color:#174f39;font-weight:800;line-height:1.2;margin:0 0 10px}
    .phase1-disclaimer{background:#f9e7cb;border:1px solid rgba(245,166,35,.18);border-radius:18px;padding:18px 20px;box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-disclaimer h3{margin:0 0 10px;color:#174f39;font-weight:900;letter-spacing:.01em}
    .phase1-disclaimer p{margin:0;line-height:1.7;color:var(--ink)}
    .phase1-text-block{display:flex;flex-direction:column;gap:10px}
    .phase1-text-block p{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-text-block strong{font-weight:800}
    .phase1-bullets{margin:0;padding-left:1.2rem;line-height:1.8;color:var(--ink)}
    .phase1-page--workflow{gap:16px}
    .phase1-workflow-intro{background:#eff8ef;border:1px solid rgba(23,79,57,.22);border-radius:18px;padding:18px 20px;box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-workflow-intro h3{margin:0 0 10px;color:#174f39;font-weight:900;letter-spacing:.02em}
    .phase1-workflow-intro p{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-phase-heading{margin:0 0 10px;color:#174f39;font-weight:900;line-height:1.25}
    .phase1-goal{margin:0 0 14px;color:var(--ink);line-height:1.8}
    .phase1-phase-list{margin:0;padding-left:1.2rem;line-height:1.85;color:var(--ink)}
    .phase1-phase-list li{margin:8px 0}
    .phase1-callout--green{background:#eff8ef;border:1px solid rgba(23,79,57,.22);box-shadow:0 10px 24px rgba(26,26,26,.04)}
    .phase1-callout--green h4,.phase1-callout--orange h4{margin:0 0 8px;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900}
    .phase1-callout--green h4{color:#174f39}
    .phase1-callout--orange{background:#f9e7cb;border:1px solid rgba(245,166,35,.22);box-shadow:0 10px 24px rgba(26,26,26,.04)}
    .phase1-callout--orange h4{color:#9b5b00}
    .phase1-software-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .phase1-software-card{padding:18px;border-radius:18px;background:#fff;border:1px solid rgba(23,79,57,.12);box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-software-card h3{margin:0 0 10px;color:#174f39;font-weight:900;line-height:1.2}
    .phase1-software-card p{margin:0 0 10px;line-height:1.8;color:var(--ink)}
    .phase1-software-card ol{margin:0;padding-left:1.2rem;line-height:1.8;color:var(--ink)}
    .phase1-software-card li{margin:6px 0}
    .phase1-software-subtitle{margin:8px 0 0;color:var(--muted);font-size:.96rem;line-height:1.7}
    .phase1-software-section{display:flex;flex-direction:column;gap:12px}
    .phase1-reading-page{gap:16px}
    .phase1-reading-intro{background:#eff8ef;border:1px solid rgba(23,79,57,.18);border-radius:18px;padding:18px 20px;box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-reading-intro h2{margin:0 0 8px;color:#174f39;font-weight:900;line-height:1.15}
    .phase1-reading-intro p{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-reading-section-title{margin:0 0 12px;color:#174f39;font-weight:900;line-height:1.2}
    .phase1-reading-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .phase1-reading-card{padding:18px;border-radius:18px;background:#fff;border:1px solid rgba(23,79,57,.12);box-shadow:0 12px 28px rgba(26,26,26,.04);display:flex;flex-direction:column;gap:10px}
    .phase1-reading-card h3{margin:0;color:#174f39;font-weight:900;line-height:1.25}
    .phase1-reading-card p{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-reading-link{display:inline-flex;align-items:center;gap:6px;margin-top:auto;font-weight:800;color:#174f39}
    .phase1-reading-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .phase1-reading-tip{padding:16px 18px;border-radius:16px;background:#fff;border:1px solid rgba(23,79,57,.10);box-shadow:0 10px 24px rgba(26,26,26,.04)}
    .phase1-reading-tip h4{margin:0 0 8px;color:#174f39;font-weight:900}
    .phase1-reading-tip p{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-reading-timeline{display:grid;grid-template-columns:1fr;gap:14px}
    .phase1-reading-why{background:#f9e7cb;border:1px solid rgba(245,166,35,.24);border-radius:18px;padding:18px 20px;box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-reading-why h4{margin:0 0 10px;color:#9b5b00;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .phase1-reading-why p{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-appraisal-page{gap:16px}
    .phase1-appraisal-intro{background:#eff8ef;border:1px solid rgba(23,79,57,.18);border-radius:18px;padding:18px 20px;box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-appraisal-intro h2{margin:0 0 8px;color:#174f39;font-weight:900;line-height:1.15}
    .phase1-appraisal-intro p{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-appraisal-section-title{margin:0 0 12px;color:#174f39;font-weight:900;line-height:1.2}
    .phase1-appraisal-text{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-appraisal-table thead th{background:#154b35;color:#fff;font-size:.82rem;letter-spacing:.08em;text-transform:none}
    .phase1-appraisal-table tbody td{background:#fff;color:var(--ink)}
    .phase1-appraisal-table tbody td:first-child{color:#154b35;font-weight:800;width:30%}
    .phase1-appraisal-table tbody td:nth-child(2){color:#111}
    .phase1-appraisal-table tbody tr:last-child td{border-bottom:none}
    .phase1-appraisal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .phase1-appraisal-card{padding:18px;border-radius:18px;background:#fff;border:1px solid rgba(23,79,57,.12);box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-appraisal-card h3{margin:0 0 10px;color:#174f39;font-weight:900;line-height:1.2}
    .phase1-appraisal-card p,.phase1-appraisal-card li{line-height:1.8;color:var(--ink)}
    .phase1-appraisal-card ul,.phase1-appraisal-card ol{margin:0;padding-left:1.2rem}
    .phase1-appraisal-card li{margin:6px 0}
    .phase1-appraisal-callout{background:#eff8ef;border:1px solid rgba(23,79,57,.22);border-radius:18px;padding:18px 20px;box-shadow:0 12px 28px rgba(26,26,26,.04)}
    .phase1-appraisal-callout h4{margin:0 0 8px;color:#174f39;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .phase1-appraisal-callout p{margin:0;line-height:1.8;color:var(--ink)}
    .phase1-quiz{display:flex;flex-direction:column;gap:14px}
    .phase1-quiz-q{padding:14px;border-radius:16px;background:rgba(255,255,255,.96);border:1px solid rgba(27,107,107,.08)}
    .phase1-quiz-q legend{font-weight:700;margin-bottom:8px}
    .phase1-quiz-q label{display:block;margin:7px 0;line-height:1.45}
    .phase1-unlock-overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(6,37,36,.52);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:phase1UnlockFade .15s ease both}
    .phase1-unlock-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 28px;border-radius:26px;background:rgba(255,255,255,.96);border:1px solid rgba(27,107,107,.12);box-shadow:0 24px 60px rgba(0,0,0,.22);text-align:center;max-width:360px;animation:phase1UnlockPulse 1.4s ease-in-out infinite}
    .phase1-unlock-lock{font-size:clamp(3.5rem,7vw,5.5rem);line-height:1;filter:drop-shadow(0 14px 24px rgba(27,107,107,.22));animation:phase1UnlockSpin 1.1s ease-in-out both}
    .phase1-unlock-card h3{margin:0;font-size:1.2rem;font-weight:900;color:var(--ink)}
    .phase1-unlock-card p{margin:0;color:var(--muted);line-height:1.6}
    .phase1-page-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
    .phase-progress-wrap{margin:12px 0 14px;padding:12px;border-radius:16px;background:linear-gradient(180deg, var(--light-teal), var(--light-grey));border:1px solid rgba(27,107,107,.12)}
    .phase-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .phase-progress-title{font-weight:900;color:var(--accent)}
    .phase-progress-bar{height:10px;border-radius:999px;background:#fff;overflow:hidden;border:1px solid rgba(27,107,107,.10)}
    .phase-progress-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--mid-teal))}
    .phase-progress-caption{margin-top:8px;font-size:.88rem;color:var(--muted)}
    .phase-item-list{display:flex;flex-direction:column;gap:8px}
    .phase-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;width:100%;padding:14px;border-radius:18px;background:var(--white);border:1px solid rgba(26,26,26,.06);text-align:left;transition:transform .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease}
    .phase-item:hover{transform:translateY(-1px);border-color:rgba(27,107,107,.18);box-shadow:0 12px 24px rgba(27,107,107,.06)}
    .phase-item.is-active{background:var(--primary);color:var(--white);border-color:var(--primary)}
    .phase-item.is-complete{border-color:rgba(27,107,107,.22)}
    .phase-item.is-gate{border-color:rgba(245,166,35,.34);background:linear-gradient(180deg, rgba(245,166,35,.10), var(--white))}
    .phase-item.is-locked{opacity:.72}
    .phase-item-left{display:flex;flex-direction:column;gap:6px}
    .phase-item-type{display:inline-flex;align-items:center;gap:6px;width:max-content;padding:4px 8px;border-radius:999px;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:var(--light-teal);color:var(--primary)}
    .phase-item.is-active .phase-item-type{background:rgba(255,255,255,.16);color:var(--white)}
    .phase-item.is-gate .phase-item-type{background:rgba(245,166,35,.16);color:var(--amber)}
    .phase-item-title{font-size:.96rem;font-weight:900;line-height:1.35}
    .phase-item-meta{font-size:.8rem;color:var(--muted)}
    .phase-item.is-active .phase-item-meta,.phase-item.is-active .phase-item-title{color:var(--white)}
    .phase-item-status{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
    .phase-item.is-active .phase-item-status{color:var(--white)}
    .phase-item-status.is-ready{color:var(--primary)}
    .phase-item-status.is-create{color:var(--amber)}
    .phase-item-status.is-curate{color:var(--primary)}
    .phase-item-status.is-gate{color:var(--amber)}
    .phase-item-lock{font-size:1rem;line-height:1}
    .portal-grid{display:grid;grid-template-columns:minmax(290px,320px) minmax(0,1fr);gap:20px;align-items:start}
    .portal-stage{display:flex;flex-direction:column;gap:16px}
    .view-hero{background:var(--white);border:1px solid rgba(27,107,107,.08);border-radius:24px;padding:24px;box-shadow:0 18px 40px rgba(27,107,107,.06)}
    .view-kicker{font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
    .view-title{margin:0;font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:700;color:var(--ink);line-height:1.12}
    .view-subtitle{margin-top:10px;font-size:1rem;line-height:1.7;color:var(--muted);max-width:72ch}
    .view-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .view-badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.78rem;font-weight:900;letter-spacing:.02em}
    .detail-card{background:var(--white);border:1px solid rgba(27,107,107,.08);border-radius:22px;padding:26px;box-shadow:0 16px 36px rgba(27,107,107,.06)}
    .detail-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
    .detail-type{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--light-teal);color:var(--primary);font-weight:900;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
    .detail-status{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-weight:900;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;background:rgba(27,107,107,.08);color:var(--primary)}
    .detail-status.is-create{background:rgba(245,166,35,.16);color:var(--amber)}
    .detail-status.is-curate{background:rgba(168,212,212,.22);color:var(--primary)}
    .detail-status.is-ready{background:rgba(27,107,107,.08);color:var(--primary)}
    .detail-status.is-gate{background:rgba(245,166,35,.18);color:var(--amber)}
    .detail-body{margin-top:16px;font-size:1rem;line-height:1.8;color:var(--ink);max-width:68ch}
    .detail-body h2{font-size:1.15rem;margin:0 0 .5rem 0;font-weight:700}
    .detail-body h3{font-size:1rem;margin:0 0 .5rem 0;font-weight:600}
    .detail-body p{margin:0 0 1rem 0}
    .detail-body ul{margin:0 0 1rem 1.1rem}
    .detail-body ol{margin:0 0 1rem 1.2rem}

        { id: 'q3', q: 'Your team conducts a systematic review but the included studies are too heterogeneous to pool statistically. What should you do?', options: ['A. Abandon the review — it cannot be published without a forest plot.', 'B. Cherry-pick the most similar studies and pool only those.', 'C. Conduct a structured narrative synthesis instead — this is a valid publishable output.', 'D. Change your eligibility criteria until the studies become homogeneous enough to pool.'], answer: 'C' },

        { id: 'q5', q: 'Why do you register your review on PROSPERO before searching?', options: ['A. It is required by all journals before submission.', 'B. It creates a public time-stamped record of your question and methods, preventing outcome-reporting bias and duplicate reviews.', 'C. It gives you access to full-text articles.', 'D. It automatically generates a search strategy for you.'], answer: 'B' },
        { id: 'q6', q: "What does the 'P' stand for in PICO?", options: ['A. Protocol', 'B. Publication', 'C. Population', 'D. Primary outcome'], answer: 'C' },
        { id: 'q7', q: 'A scoping search (H1) is the same as the full systematic search you will conduct in Phase 3.', options: ['A. True — both involve the same databases and level of detail.', 'B. False — a scoping search is a quick 1–2 hour reconnaissance to check your question is not already answered. The full search is exhaustive and built with a librarian.', 'C. True — both take the same amount of time.', 'D. False — a scoping search is done after registration, not before.'], answer: 'B' },
        { id: 'q8', q: 'PRISMA stands for:', options: ['A. Preferred Reporting Items for Systematic reviews and Meta-Analyses.', 'B. Primary Research in Systematic Medical Abstracts.', 'C. Protocol Registration and Indexing of Systematic Meta-Analyses.', 'D. Peer Review in Systematic Medical Assessment.'], answer: 'A' },
        { id: 'q9', q: 'Which of the following is the strongest study design for testing whether an intervention works?', options: ['A. Case series', 'B. Cross-sectional study', 'C. Cohort study', 'D. Randomised controlled trial'], answer: 'D' },
        { id: 'q10', q: 'You are reading a study and notice that a large number of participants dropped out before the end, and this is not accounted for in the analysis. This is an example of:', options: ['A. Detection bias', 'B. Selection bias', 'C. Attrition bias', 'D. Performance bias'], answer: 'C' }
      ],

      phase1Content: {
        'phase1-1': `
          <div class="phase1-page">
            <section class="phase1-section-card">
              <h2>Welcome to the IHSAAN Medics Research Mentorship Programme</h2>
              <p>You have been accepted onto the SRMA Pilot Programme. Over the next 12–16 weeks, you and your team will conduct a systematic review of published medical literature — and leave with a registered PROSPERO protocol and a complete manuscript draft ready for journal submission.</p>
              <p>This portal is your home for the programme: every resource, guide, template and deadline is here. Work through the items in order, mark items complete as you go, and submit your Topic Proposal &amp; Feasibility Form at Gate 1 for supervisor approval.</p>
            </section>

            <section class="phase1-section-card">
              <h3>What this portal contains</h3>
              <ul class="phase1-portal-list">
                <li><strong>Guides and how-tos</strong> for every step of the review process, from topic development to manuscript submission.</li>
                <li><strong>Templates and forms</strong> to download, complete, and upload at the right points in the programme.</li>
                <li><strong>Short videos and screen recordings</strong> that show the software-based steps in a practical, visual way.</li>
                <li><strong>Knowledge checks</strong> at the end of each phase so you can confirm understanding before moving on.</li>
                <li><strong>Gates</strong> where your supervisor signs off before you progress to the next stage.</li>
              </ul>
            </section>

            <section class="phase1-section-card">
              <h3>What to do right now</h3>
              <ol class="phase1-action-list">
                <li>Read the Welcome page you are on now.</li>
                <li>Work through the Phase 1 items in the sidebar, in order.</li>
                <li>Complete the Phase 1 Knowledge Check.</li>
                <li>Submit your topic at Gate 1.</li>
              </ol>
            </section>

            <section class="phase1-callout is-amber">
              <h3>Your guaranteed deliverable</h3>
              <p>The programme guarantees a registered PROSPERO protocol and a complete manuscript draft. Journal submission and acceptance are the aspirational goal — they may continue after Week 16 and are not guaranteed.</p>
            </section>

            <section class="phase1-section-card">
              <h3>A note on authorship</h3>
              <p>Joining the programme does not guarantee authorship. Authorship is earned through real, documented contribution to the work. The Research Integrity &amp; Authorship Policy sets out the rules clearly. Read it early.</p>
            </section>

            <section class="phase1-section-card">
              <h3>Need help?</h3>
              <p>Contact the IHSAAN team via the Support page. Your supervisor is there for methodological and clinical guidance — use the check-in schedule to make the most of their time.</p>
            </section>
          </div>
        `,
        'phase1-2': `
          <div class="phase1-page">
            <section class="phase1-section-card">
              <p class="eyebrow">Page 2 of 9 — What Is an SRMA? Introductory Guide</p>
              <h2 class="phase1-section-title">What Is a Systematic Review and Meta-Analysis?</h2>
              <p>A plain-English introduction to the type of research you are about to do.</p>
              <p><strong>Start here: four types of review</strong></p>
              <p>The medical literature is full of different kinds of reviews. Here is how they differ.</p>
              <table class="phase1-table phase1-table--srma">
                <thead>
                  <tr><th>Type</th><th>What it is</th></tr>
                </thead>
                <tbody>
                  <tr><td>Narrative Review</td><td>A broad overview written by an expert, summarising what is known about a topic. Not reproducible — two people doing the same review might reach different conclusions.</td></tr>
                  <tr><td>Scoping Review</td><td>Maps out what research exists on a topic without formally assessing quality. Good for understanding a field, not for answering a specific clinical question.</td></tr>
                  <tr><td>Systematic Review</td><td>A reproducible, exhaustive search of the literature to answer one specific, pre-defined question. Every step is documented so another researcher could repeat it. This is what you are doing.</td></tr>
                  <tr><td>Meta Analysis</td><td>A statistical technique used inside a systematic review to pool numerical results from multiple studies into a single combined estimate. Not all systematic reviews include a meta-analysis — and that is fine.</td></tr>
                </tbody>
              </table>
            </section>
            <section class="phase1-disclaimer">
              <h3>IMPORTANT — NARRATIVE SYNTHESIS IS NOT A FAILURE</h3>
              <p>Many student reviews end up doing a narrative synthesis rather than a meta-analysis. This happens when studies are too different from each other to pool statistically. A well-conducted narrative synthesis is a valid, publishable output. Do not drop out if a forest plot does not materialise.</p>
            </section>
            <section class="phase1-section-card">
              <h2 class="phase1-section-title">Why systematic reviews matter</h2>
              <div class="phase1-text-block">
                <p>A well-conducted systematic review sits at the top of the evidence hierarchy. It tells clinicians, policymakers, and researchers what the totality of published evidence says about a question — not just one study, but all of them. That is why they get published and why they influence clinical guidelines.</p>
              </div>
            </section>
            <section class="phase1-section-card">
              <h2 class="phase1-section-title">The infrastructure that makes systematic reviews trustworthy</h2>
              <div class="phase1-text-block">
                <p><strong>PROSPERO</strong></p>
                <p>PROSPERO is the international register for systematic reviews. You register your review before you start searching — this creates a public, time-stamped record of your question, methods, and analysis plan. It prevents outcome-reporting bias (changing your question after you see the results) and stops two teams accidentally doing the same review.</p>
                <p><strong>Note:</strong> PROSPERO only accepts systematic reviews. It does not accept scoping reviews or pure literature reviews.</p>
                <p><strong>PRISMA</strong></p>
                <p>PRISMA (Preferred Reporting Items for Systematic reviews and Meta-Analyses) is the reporting standard for systematic reviews. The PRISMA 2020 checklist tells you exactly what to include in your manuscript — and journals expect you to follow it. You will also produce a PRISMA flow diagram showing how many records you found, screened, and included.</p>
              </div>
            </section>
            <section class="phase1-section-card">
              <h2 class="phase1-section-title">What you will look to produce on this programme</h2>
              <ul class="phase1-bullets">
                <li>A registered PROSPERO protocol — your pre-committed question and methods</li>
                <li>A PRISMA 2020 flow diagram — your audit trail of records found and screened</li>
                <li>A data extraction sheet — the data you pulled from each included study</li>
                <li>A risk-of-bias assessment — a judgement of each study's methodological quality</li>
                <li>A synthesis — either a meta-analysis (pooled statistics) or a structured narrative synthesis</li>
                <li>A complete manuscript draft — structured to PRISMA 2020, ready for supervisor review and journal submission</li>
              </ul>
            </section>
          </div>
        `,
        'phase1-3': `
          <div class="phase1-page phase1-page--workflow">
            <section class="phase1-section-card">
              <p class="eyebrow">Page 3 of 9 — Your Project Workflow: Phase by Phase</p>
              <h2 class="phase1-section-title">Your Project Workflow: Phase by Phase</h2>
              <p class="muted"><em>Your map from Week 1 to submission. For the detailed how-to at each step, follow the guides in each phase.</em></p>
            </section>

            <section class="phase1-workflow-intro">
              <h3>HOW TO READ THIS PAGE</h3>
              <p>Each phase has a goal, a list of tasks, and a deliverable that your supervisor signs off at the Gate. Work through tasks in order. If something is unclear, the how-to guide for that step is in the sidebar.</p>
            </section>

            <section class="phase1-section-card">
              <h3 class="phase1-phase-heading">Phase 1 — Foundations (Weeks 1–2)</h3>
              <p class="phase1-goal">Goal: confirm your review question is original and feasible, and get supervisor approval to proceed.</p>
              <ul class="phase1-phase-list">
                <li>Get set up: Zotero, Rayyan, database access</li>
                <li>Understand what a systematic review is and what this programme produces</li>
                <li>Break your research idea into a PICO/PECO question (population, intervention/exposure, comparator, outcome)</li>
                <li>Do a scoping search on PROSPERO and PubMed to check your question is not already answered</li>
                <li>Complete the Phase 1 Knowledge Check</li>
                <li>Submit your topic via the Gate 1 form — supervisor approves before you proceed</li>
              </ul>
              <div class="phase1-callout phase1-callout--green">
                <h4>Gate 1 Deliverable</h4>
                <p>Topic Proposal &amp; Feasibility Form — supervisor-approved.</p>
              </div>
            </section>

            <section class="phase1-section-card">
              <h3 class="phase1-phase-heading">Phase 2 — Question &amp; Protocol (Weeks 3–5)</h3>
              <p class="phase1-goal">Goal: lock in your precise question, write a protocol, and register it on PROSPERO.</p>
              <ul class="phase1-phase-list">
                <li>Refine your PICO/PECO question with worked examples</li>
                <li>Write your eligibility criteria (what studies you will and will not include)</li>
                <li>Build a search strategy with a librarian — MeSH terms, Boolean logic, database translation</li>
                <li>Write your full protocol using the PRISMA-P template</li>
                <li>Register your protocol on PROSPERO</li>
                <li>Complete the Phase 2 Knowledge Check</li>
              </ul>
              <div class="phase1-callout phase1-callout--green">
                <h4>Gate 2 Deliverable</h4>
                <p>Protocol draft — supervisor-approved.</p>
              </div>
              <div class="phase1-callout phase1-callout--green" style="margin-top:12px;">
                <h4>Gate 3 Deliverable</h4>
                <p>PROSPERO registration number — submitted.</p>
              </div>
            </section>

            <section class="phase1-section-card">
              <h3 class="phase1-phase-heading">Phase 3 — Screening &amp; Synthesis (Weeks 6–10)</h3>
              <p class="phase1-goal">Goal: run your searches, screen all records, extract data, assess risk of bias, and produce your synthesis.</p>
              <ul class="phase1-phase-list">
                <li>Run searches across PubMed, Embase/Ovid, and Cochrane CENTRAL — export to Zotero</li>
                <li>Deduplicate your results</li>
                <li>Screen titles and abstracts in Rayyan with your co-screener (blind, independently)</li>
                <li>Screen full texts and log exclusion reasons</li>
                <li>Complete the PRISMA 2020 flow diagram</li>
                <li>Extract data from included studies using the extraction template</li>
                <li>Assess risk of bias (RoB 2 for RCTs, ROBINS-I for non-randomised studies)</li>
                <li>Decide on meta-analysis or narrative synthesis — both are valid</li>
                <li>Conduct your synthesis</li>
                <li>Apply GRADE certainty ratings</li>
                <li>Complete the Phase 3 Knowledge Check</li>
              </ul>
              <div class="phase1-callout phase1-callout--green">
                <h4>Gate 4 Deliverable</h4>
                <p>Analysis outputs (PRISMA diagram, extraction sheet, RoB table, synthesis) — supervisor-approved.</p>
              </div>
            </section>

            <section class="phase1-section-card">
              <h3 class="phase1-phase-heading">Phase 4 — Writing &amp; Submission (Weeks 11–16)</h3>
              <p class="phase1-goal">Goal: write the manuscript, get supervisor sign-off, select a journal, and submit.</p>
              <ul class="phase1-phase-list">
                <li>Write each section of your manuscript using the template and PRISMA 2020 checklist</li>
                <li>Manage citations with Zotero</li>
                <li>Choose a journal and verify it is not predatory (Think-Check-Submit, DOAJ)</li>
                <li>Get supervisor manuscript approval</li>
                <li>Complete the Pre-Submission QA Checklist</li>
                <li>Submit — and update your PROSPERO record to mark the review as completed</li>
                <li>Respond to peer review if invited</li>
              </ul>
              <div class="phase1-callout phase1-callout--green">
                <h4>Gate 5 Deliverable</h4>
                <p>Manuscript draft — supervisor-approved.</p>
              </div>
              <div class="phase1-callout phase1-callout--green" style="margin-top:12px;">
                <h4>Gate 6 Deliverable</h4>
                <p>Submission readiness confirmed — programme complete.</p>
              </div>
            </section>

            <section class="phase1-callout phase1-callout--orange">
              <h4>Timeline Note</h4>
              <p>Submission and acceptance may continue after Week 16. The guaranteed programme deliverable is a complete, supervisor-approved manuscript draft. What happens after submission is outside the programme window but the IHSAAN team will support you through it.</p>
            </section>
          </div>
        `,
        'phase1-4': `
          <div class="phase1-page phase1-software-section">
            <section class="phase1-section-card">
              <p class="eyebrow">Page 4 of 9 — Software &amp; Access Setup</p>
              <h2 class="phase1-section-title">Software &amp; Access Setup</h2>
              <p class="phase1-software-subtitle"><em>Do this once in Week 1. Every how-to guide in the programme assumes you have completed these steps.</em></p>
            </section>

            <section class="phase1-workflow-intro">
              <h3>BEFORE YOU START</h3>
              <p>This page takes about 30 minutes. Work through it top to bottom. If you get stuck on database access, check with your university library or contact the IHSAAN team before your first supervisor check-in.</p>
            </section>

            <div class="phase1-software-grid">
              <section class="phase1-software-card">
                <h3>Step 1 — Zotero (reference manager)</h3>
                <p>Zotero is the free reference manager you will use to collect, organise, and de-duplicate your search results — and to generate your bibliography when writing.</p>
                <ol>
                  <li>Go to zotero.org and create a free account.</li>
                  <li>Download and install the Zotero desktop app.</li>
                  <li>Install the Zotero Connector browser extension (this lets you save references from PubMed and other databases with one click).</li>
                  <li>Open the desktop app and sign in. You should see your library synced.</li>
                </ol>
              </section>

              <section class="phase1-software-card">
                <h3>Step 2 — Rayyan (screening tool)</h3>
                <p>Rayyan is the free screening platform you and your co-screener will use to screen titles and abstracts independently, then reconcile disagreements.</p>
                <ol start="5">
                  <li>Go to rayyan.ai and create a free account.</li>
                  <li>You do not need to create a project yet — wait until Phase 3 when you have your search results.</li>
                </ol>
              </section>

              <section class="phase1-software-card">
                <h3>Step 3 — Database access</h3>
                <p>You will search several databases. Here is how to access each one.</p>
                <p><strong>PubMed — free for everyone</strong></p>
                <ol start="7">
                  <li>Go to pubmed.ncbi.nlm.nih.gov — no login required.</li>
                  <li>Create a free NCBI account so you can save searches and set up email alerts. Click "Log in" in the top right.</li>
                </ol>
                <p><strong>Cochrane CENTRAL and PROSPERO — free for everyone</strong></p>
                <ol start="9">
                  <li>Cochrane Library: cochranelibrary.com — no login required for searching.</li>
                  <li>PROSPERO: crd.york.ac.uk/prospero — no login required for searching. You will need to create a free account when you register your own review in Phase 2.</li>
                </ol>
                <p><strong>Embase / Ovid — requires institutional access</strong></p>
                <p>Embase is accessed via Ovid or Athens, and requires a university login. Most UK medical students have access through their university.</p>
                <ol start="11">
                  <li>Search for your university name + "OpenAthens" or "Shibboleth" login.</li>
                  <li>Log in at your institution's library page — not directly at ovid.com.</li>
                  <li>Once logged in, navigate to Ovid &gt; Databases &gt; Embase.</li>
                </ol>
                <p>If you cannot access Embase/Ovid through your institution, contact your university library — it is usually available through NHS OpenAthens if you have an NHS placement login.</p>
              </section>

              <section class="phase1-software-card">
                <h3>Step 4 — Optional but useful</h3>
                <ol>
                  <li>GRADEpro (gradepro.org) — for certainty of evidence assessments in Phase 3. Free account.</li>
                  <li>RevMan (Cochrane RevMan) — for meta-analysis in Phase 3 if using the Cochrane tool. Free download from training.cochrane.org.</li>
                  <li>R + the meta package — an alternative to RevMan for more flexible meta-analysis. Free, but requires basic R familiarity.</li>
                </ol>
              </section>
            </div>

            <section class="phase1-callout phase1-callout--green">
              <h4>All set?</h4>
              <p>Once you have Zotero installed, a Rayyan account, and database access confirmed, you are ready for the rest of Phase 1. If database access is taking time to sort out, do not let it block you — continue with the other Phase 1 items and resolve it before Phase 3 begins.</p>
            </section>
          </div>
        `,
        'phase1-5': `
          <div class="phase1-page phase1-reading-page">
            <section class="phase1-reading-intro">
              <p class="eyebrow">Page 5 of 9 — Curated Reading List</p>
              <h2>Curated Reading List</h2>
              <p><em>Everything you need to understand the methodology — curated from the best free sources, so you are not lost online.</em></p>
            </section>

            <section class="phase1-section-card">
              <h3 class="phase1-reading-section-title">The essential free resources</h3>
              <p class="phase1-software-subtitle">These are the authoritative sources for systematic review methodology. Bookmark them. You will return to them throughout the programme.</p>
              <div class="phase1-reading-grid">
                <article class="phase1-reading-card">
                  <h3>Cochrane Handbook for Systematic Reviews of Interventions</h3>
                  <p>The definitive reference for how to conduct a systematic review. You do not need to read it cover to cover — use it as a reference when you have a specific question about methodology. Chapter 6 (searching) and Chapter 7 (screening) are especially useful in Phase 2–3.</p>
                  <a class="phase1-reading-link" href="https://training.cochrane.org/handbook" target="_blank" rel="noopener">Cochrane Handbook (free, online) →</a>
                </article>

                <article class="phase1-reading-card">
                  <h3>Cochrane Interactive Learning</h3>
                  <p>Free online modules that teach systematic review methods step by step, with exercises. These are high quality and cover the same ground as this programme. Use them to go deeper on any topic — especially risk of bias, meta-analysis, and GRADE.</p>
                  <a class="phase1-reading-link" href="https://training.cochrane.org/interactivelearning" target="_blank" rel="noopener">Cochrane Interactive Learning →</a>
                </article>

                <article class="phase1-reading-card">
                  <h3>PRISMA 2020</h3>
                  <p>The reporting standard you must follow. The website has the checklist, the flow diagram template, and explanation papers for each item. Bookmark this — you will use it in Phase 2 (protocol) and Phase 4 (manuscript).</p>
                  <a class="phase1-reading-link" href="http://www.prismastatement.org" target="_blank" rel="noopener">PRISMA 2020 Statement and Checklist →</a>
                </article>

                <article class="phase1-reading-card">
                  <h3>PROSPERO</h3>
                  <p>The international register for systematic reviews. You will register your review here in Phase 2. Use the search function now to check whether your question is already registered.</p>
                  <a class="phase1-reading-link" href="https://www.crd.york.ac.uk/prospero" target="_blank" rel="noopener">PROSPERO Register →</a>
                </article>

                <article class="phase1-reading-card" style="grid-column:1 / -1;">
                  <h3>Your university library systematic review guide</h3>
                  <p>Almost every UK university library has its own SR guide — with institution-specific database login instructions, librarian contact details, and local resources. Find yours by searching: [your university name] + "systematic review guide" + "library".</p>
                </article>
              </div>
            </section>

            <section class="phase1-section-card">
              <h3 class="phase1-reading-section-title">Stay current: how to find research ideas</h3>
              <p class="phase1-software-subtitle">The best systematic review ideas come from gaps you notice in the current literature — and the best way to notice gaps is to stay up to date with what is being published. Here is the habit we recommend you build from Week 1.</p>

              <div class="phase1-reading-timeline">
                <div class="phase1-reading-tip">
                  <h4>FIND YOUR TOP 4 JOURNALS</h4>
                  <p>Identify the four most important journals in your specialty or sub-specialty. These are the journals that publish the studies you would want to include in a review, and where you would want to publish your own work. If you are not sure which journals matter in your field, ask your supervisor — they will know instantly.</p>
                </div>

                <div class="phase1-reading-list">
                  <div class="phase1-reading-tip">
                    <h4>Step 1 — Identify your top 4 journals</h4>
                    <p>Think about your specialty. If you are interested in cardiology, that might be the New England Journal of Medicine, JAMA Cardiology, the European Heart Journal, and Heart. If you are in surgery, it might be the British Journal of Surgery, JAMA Surgery, Annals of Surgery, and the Lancet.</p>
                    <p>A quick way to find the leading journals in any field: search PubMed for a topic you care about, filter by systematic review, and look at where the best recent reviews were published. Those are your target journals.</p>
                  </div>

                  <div class="phase1-reading-tip">
                    <h4>Step 2 — Subscribe to their table of contents alerts</h4>
                    <p>Every major journal sends a free weekly or monthly email with its latest contents — titles, abstracts, links. This takes two minutes to set up and means the literature comes to you instead of you hunting for it.</p>
                    <ol class="phase1-bullets" style="margin-top:10px;">
                      <li>Go to each journal's website.</li>
                      <li>Find "Alerts", "Email notifications", or "Table of Contents" — usually under "For Authors" or in the footer.</li>
                      <li>Enter your email and subscribe.</li>
                    </ol>
                    <p>You will get an email each time a new issue is published. Scan the titles. Anything that catches your eye, save it to Zotero.</p>
                  </div>

                  <div class="phase1-reading-tip" style="grid-column:1 / -1;">
                    <h4>Step 3 — Follow them on X (Twitter)</h4>
                    <p>Most top medical journals are active on X and post new research daily. Following them takes thirty seconds and means your timeline becomes a live feed of what is being published.</p>
                    <p>Search for your journals on X and follow their official accounts. Examples: @NEJM, @JAMAInternalMed, @TheLancet, @EuropeanHeartJ. Most publish daily highlights, open-access papers, and links to new systematic reviews as soon as they go live.</p>
                  </div>
                </div>
              </div>
            </section>

            <section class="phase1-reading-why">
              <h4>WHY THIS MATTERS</h4>
              <p>Staying current is how you spot research gaps — the question that nobody has quite answered yet, or the field where a lot of new primary studies have appeared since the last review. This is where good review ideas come from. Make it a habit from day one.</p>
            </section>
          </div>
        `,
        'phase1-6': `
          <div class="phase1-page">
            <section class="phase1-section-card"><div class="pdf-viewer" style="height:420px">Upload/Embed H1 Scoping Search PDF here</div><div class="phase1-page-actions" style="margin-top:14px"><a class="btn" href="#">Download PDF</a><button class="btn primary" data-toggle-complete="phase1-6">Mark as Complete</button></div></section>
          </div>
        `,
        'phase1-7': `
          <div class="phase1-page">
            <section class="phase1-section-card">
              <h2>Worked Exemplar: A Systematic Review, Annotated</h2>
              <p>Read one well-conducted published systematic review from start to finish. Annotations throughout point out what makes each section good — and what to replicate in your own work.</p>

        'phase1-8': `
          <div class="phase1-page phase1-appraisal-page">
            <section class="phase1-appraisal-intro">
              <p class="eyebrow">Page 8 of 9 — Critical Appraisal Mini-Guide</p>
              <h2>Critical Appraisal Mini-Guide</h2>
              <p><em>How to read a medical paper — and how to spot when something is not right.</em></p>
              <p>Critical appraisal is the skill of reading a study carefully and asking: is this research valid? Are the conclusions justified by the data? Should I trust this result?</p>
              <p>You will need this skill throughout the programme — when assessing studies for inclusion in your review, and when conducting formal risk-of-bias assessment in Phase 3. This guide gives you the foundations.</p>
            </section>

            <section class="phase1-section-card">
              <h3 class="phase1-appraisal-section-title">Step 1 — Read the abstract first, then the full paper</h3>
              <p class="phase1-appraisal-text">Read the abstract to understand what the study claims. Then read the full paper to decide whether those claims are justified. The abstract is written to sell the paper; the Methods section is where the truth lives.</p>
            </section>

            <section class="phase1-section-card">
              <h3 class="phase1-appraisal-section-title">Step 2 — Identify the study design</h3>
              <p class="phase1-appraisal-text" style="margin-bottom:12px;">The study design determines what you can and cannot conclude. The main designs you will encounter in systematic reviews:</p>
              <table class="phase1-table phase1-appraisal-table">
                <thead>
                  <tr><th>Study design</th><th>What it tells you</th></tr>
                </thead>
                <tbody>
                  <tr><td>Randomised controlled trial (RCT)</td><td>The strongest evidence for whether an intervention works. Participants are randomly assigned to groups, controlling for confounders.</td></tr>
                  <tr><td>Cohort study</td><td>Follows a group of people over time. Good for understanding risk factors and prognosis. Cannot prove causation as reliably as an RCT.</td></tr>
                  <tr><td>Case-control study</td><td>Compares people with a condition to those without, looking backwards for differences in exposure. Useful for rare outcomes. Prone to recall bias.</td></tr>
                  <tr><td>Cross-sectional study</td><td>A snapshot in time. Useful for prevalence data. Cannot establish temporal relationships.</td></tr>
                  <tr><td>Case report / case series</td><td>Describes one or a few patients. Useful for hypothesis generation. Very low on the evidence hierarchy.</td></tr>
                </tbody>
              </table>
            </section>

            <div class="phase1-appraisal-grid">
              <section class="phase1-appraisal-card">
                <h3>Step 3 — Ask the PICO questions</h3>
                <ul>
                  <li><strong>Population:</strong> who were the participants, and are they similar to the patients the study claims to apply to?</li>
                  <li><strong>Intervention (or Exposure):</strong> what exactly was done to the participants, at what dose, for how long?</li>
                  <li><strong>Comparator:</strong> what was it compared to? (placebo, usual care, a different intervention?)</li>
                  <li><strong>Outcome:</strong> what was measured, and was it a meaningful outcome or a surrogate?</li>
                </ul>
              </section>

              <section class="phase1-appraisal-card">
                <h3>Step 4 — Assess the risk of bias</h3>
                <p>Risk of bias refers to the ways a study's design or conduct may have introduced systematic error — making the results less trustworthy. In Phase 3, you will use formal tools (RoB 2 for RCTs, ROBINS-I for non-randomised studies) to do this systematically. For now, learn to spot the major issues:</p>
                <ul>
                  <li><strong>Selection bias:</strong> were participants randomised? If not, are the groups comparable at baseline?</li>
                  <li><strong>Performance bias:</strong> did participants or researchers know which treatment group they were in? (Blinding)</li>
                  <li><strong>Detection bias:</strong> was the outcome measured in the same way in both groups?</li>
                  <li><strong>Attrition bias:</strong> how many participants dropped out, and are they accounted for?</li>
                  <li><strong>Reporting bias:</strong> were all outcomes reported, or only the significant ones?</li>

    function normalizeProgressMap(rows){

    function readLocalProgressMap(){
      try {
        const raw = localStorage.getItem(LOCAL_PROGRESS_KEY);
        if (!raw) return new Map();
        const parsed = JSON.parse(raw);
        return new Map(Object.entries(parsed || {}).map(([moduleId, completed]) => [moduleId, !!completed]));
      } catch (error) {
        return new Map();
      }
    }

    function writeLocalProgressMap(moduleId, completed){
      try {
        const raw = localStorage.getItem(LOCAL_PROGRESS_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        parsed[moduleId] = !!completed;
        localStorage.setItem(LOCAL_PROGRESS_KEY, JSON.stringify(parsed));
      } catch (error) {}
    }

    async function loadPortalData(){
      if (!currentUser) return;
      try {
        const { data, error } = await srmaSupabase.from('student_progress').select('*').eq('user_id', currentUser.id);
        if (error) throw error;
        progressLookup = new Map([...readLocalProgressMap(), ...normalizeProgressMap(data || [])]);
      } catch (error) {
        progressLookup = readLocalProgressMap();
      }
    }

    async function upsertProgress(moduleId, completed){
      if (!currentUser) return;
      const payload = { user_id: currentUser.id, module_id: moduleId, completed };
      progressLookup.set(moduleId, completed);
      writeLocalProgressMap(moduleId, completed);

      const existingQuery = await srmaSupabase
        .from('student_progress')
        .select('user_id,module_id')
        .eq('user_id', currentUser.id)
        .eq('module_id', moduleId);

      if (existingQuery.error) {
        console.warn('Progress save skipped because the backend query failed.', existingQuery.error);
        return;
      }

      if ((existingQuery.data || []).length > 0) {
        const { error } = await srmaSupabase
          .from('student_progress')
          .update({ completed })
          .eq('user_id', currentUser.id)
          .eq('module_id', moduleId);
        if (error) {
          console.warn('Progress update fell back to local storage.', error);
          return;
        }
      } else {
        const { error } = await srmaSupabase.from('student_progress').insert(payload);
        if (error) {
          console.warn('Progress insert fell back to local storage.', error);
          return;
        }
      }
    }

                          <div class="phase1-section-card" style="margin-bottom:14px;border-color:rgba(27,107,107,.18);background:linear-gradient(180deg,#e6fff7,#f7fffd)">
                            <h4 style="margin:0 0 8px;font-size:1.02rem;font-weight:900;color:var(--b)">You passed the quiz</h4>
                            <p style="margin:0;color:var(--muted)">Your score cleared the 70% threshold, so Gate 1 is now unlocked for this account. You can review the correct answers below anytime.</p>
                            <div class="button-row" style="margin-top:12px">
                              <button type="button" class="btn primary" data-open-phase1-gate>Open Gate 1 now</button>
                            </div>
                          </div>
                          ${renderPhase1QuizAnswers()}
                        ` : `
                          <form class="quiz-form" data-quiz-id="${item.id}">
                            ${portalData.phase1Quiz.map((q, i) => `
                              <fieldset style="margin-bottom:12px">
                                <legend style="font-weight:700">${i+1}. ${q.q}</legend>
                                ${q.options.map(opt => `
                                  <label style="display:block;margin:6px 0"><input type="radio" name="${q.id}" value="${opt.charAt(0)}"> ${opt}</label>
                                `).join('')}
                              </fieldset>
                            `).join('')}
                            <div class="button-row"><button type="submit" class="btn primary">Submit and finish quiz</button></div>
                          </form>
                          <div class="quiz-feedback" aria-live="polite" style="margin-top:12px"></div>
                        `}
                  </div>
                </div>
                <div class="action-bar">
                  <div class="muted">${extraNote}</div>
                </div>
              ` : `
                <div class="content-preview">
                  <h4>${item.type === 'VIDEO' ? 'Video content' : item.type === 'TEMPLATE' ? 'Template action' : item.type === 'GATE' ? 'Gate action' : 'Resource content'}</h4>
                  <p>${previewText}</p>
                </div>
                <div class="action-bar">
                  <div class="muted">${extraNote}</div>
                  <div class="button-row">
                    ${(item.type === 'GUIDE' || item.type === 'TEMPLATE' || item.type === 'EXTERNAL') ? `<a class="btn" href="#">${item.cta}</a>` : ''}
                    <button class="btn primary" data-toggle-complete="${item.id}" ${actionDisabled ? 'disabled' : ''}>${buttonLabel}</button>
                  </div>
                </div>
              `}
            </div>
          </div>
        </section>
      `;
    }

    function renderPhase1Page(pageId){
      const phase = getPhaseData('phase1');
      if (!phase) return renderDashboard();

      if (pageId === 'phase1-10' || pageId === 'phase1-gate') {
        return renderPhase1GateBlank('phase1-10');
      }

      const item = phase?.items.find(entry => entry.id === pageId) || phase?.items[0];
      if (!item) return renderDashboard();

      const pageMeta = portalData.phase1Pages.find(page => page.id === item.id) || portalData.phase1Pages[0];
      const quizPassed = item.id === 'phase1-9' && !!progressLookup.get(item.id);
      const unlockFlash = quizPassed && (() => {
        try { return sessionStorage.getItem(PHASE1_UNLOCK_FLASH_KEY) === '1'; } catch (error) { return false; }
      })();
      return `
        <section class="phase1-page">
          <div class="phase1-page-header">
            <div class="phase1-banner">
              <div class="phase1-banner-top">
                <div>
                  <div class="phase1-banner-kicker">PHASE 1 · FOUNDATIONS</div>
                  <div class="phase1-banner-title">${pageMeta.page} — ${pageMeta.title}</div>
                  <div class="phase1-banner-meta">
                    <span class="phase1-banner-pill">Weeks 1–2</span>
                    <span class="phase1-banner-pill">${item.type}</span>
                    <span class="phase1-banner-pill">${item.status}</span>
                  </div>
                </div>
                <div class="phase1-banner-pill">${item.type === 'QUIZ' ? 'Quiz' : item.type === 'PDF' ? 'PDF upload' : 'Ready'}</div>
              </div>
            </div>
          </div>
          <div class="phase1-section-card">
            ${portalData.phase1Content[item.id] || `<div class="detail-body">${item.description}</div>`}
            <div class="phase1-page-actions" style="margin-top:16px">
              ${item.id === 'phase1-9' ? '' : `<button class="btn primary" data-toggle-complete="${item.id}">${progressLookup.get(item.id) ? 'Completed' : 'Mark as Complete'}</button>`}
            </div>
          </div>
          ${quizPassed ? `
            <div class="phase1-section-card" style="margin-top:16px;border-color:rgba(27,107,107,.18);background:linear-gradient(180deg,#e6fff7,#f7fffd)">
              <h3 style="margin:0 0 8px;font-size:1.08rem;font-weight:900;color:var(--b)">You passed the quiz</h3>
              <p style="margin:0;color:var(--muted)">Your score cleared the 70% threshold, so the answers are shown below and Gate 1 is available for this account.</p>
              <div class="button-row" style="margin-top:12px">
                <button type="button" class="btn primary" data-open-phase1-gate>Open Gate 1 now</button>
              </div>
            </div>
            ${renderPhase1QuizAnswers()}
          ` : ''}
          ${unlockFlash ? renderPhase1UnlockOverlay() : ''}
        </section>
      `;
    }

    function renderPhasePage(phaseKey){
      const phase = getPhaseData(phaseKey);
      const selectedItem = getSelectedPhaseItem(phaseKey);
      if (!phase) return renderDashboard();

      if (phaseKey === 'phase1') {
        return renderPhase1Page(currentItemId || selectedItem?.id || 'phase1-1');
      }

      const overviewMarkup = phase.overview ? `
        <section class="portal-stage">
          <div class="detail-card" style="margin-bottom:18px">
            <div class="detail-body">
              <p style="font-size:1.02rem;line-height:1.75;color:var(--ink);margin:0">${phase.overview}</p>
            </div>
          </div>
        </section>
      ` : '';

      if (!selectedItem) return overviewMarkup + renderDashboard();

      return overviewMarkup + renderPhaseItem(selectedItem, phaseKey);
    }

    function renderPage(viewKey){
      if (viewKey === 'dashboard') return renderDashboard();
      if (viewKey === 'resources') return renderResourcePage();
      if (viewKey === 'supervisor') return renderSupervisorPage();
      if (viewKey === 'support') return renderSupportPage();
      if (portalData.phases[viewKey]) return renderPhasePage(viewKey);
      return renderDashboard();
    }

    function bindSidebarEvents(){
      sidebarMount.querySelectorAll('[data-view]').forEach(control => {
        control.addEventListener('click', event => {
          event.preventDefault();
          window.showTemplate(control.getAttribute('data-view'));
        });
      });

      sidebarMount.querySelectorAll('[data-phase1-tab]').forEach(control => {
        control.addEventListener('click', () => {
          window.showTemplate('phase1', control.getAttribute('data-phase1-tab'));
        });
      });

      sidebarMount.querySelectorAll('[data-item-id]').forEach(control => {
        control.addEventListener('click', () => {
          const itemId = control.getAttribute('data-item-id');
          currentItemId = itemId;
          renderPortal();
        });
      });
    }

    function bindMainEvents(){
      mainMount.querySelectorAll('[data-toggle-complete]').forEach(button => {
        button.addEventListener('click', async () => {
          const itemId = button.getAttribute('data-toggle-complete');
          const phase = getPhaseData(currentPhaseKey);
          const item = phase?.items.find(entry => entry.id === itemId);
          if (!item) return;
          if (item.type === 'GATE' && !isGateUnlocked(currentPhaseKey, itemId)) return;
          const nextState = !progressLookup.get(itemId);
          button.disabled = true;
          await upsertProgress(itemId, nextState);
          renderPortal();
        });
      });

      mainMount.querySelectorAll('[data-open-phase1-gate]').forEach(button => {
        button.addEventListener('click', () => {
          window.showTemplate('phase1', 'phase1-10');
        });
      });

      // Bind quiz forms
      mainMount.querySelectorAll('.quiz-form').forEach(form => {
        form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          if (!currentUser) {
            alert('Please log in to submit the quiz.');
            return;
          }
          const quizId = form.getAttribute('data-quiz-id');
          const formData = new FormData(form);
          let correct = 0;
          portalData.phase1Quiz.forEach(q => {
            const val = formData.get(q.id);
            if (val === q.answer) correct += 1;
          });
          const score = correct;
          const feedbackEl = form.parentElement.querySelector('.quiz-feedback');
          if (score >= 7) {
            await upsertProgress(quizId, true);
            triggerPhase1UnlockFlow();
          } else {
            feedbackEl.innerHTML = `<div style="padding:12px;border-radius:10px;background:linear-gradient(180deg,#fff6f0,#fff8f2);border:1px solid rgba(245,166,35,.12);font-weight:700;color:var(--ink)">You scored ${score}/10. You need 7/10 (70%) to unlock Gate 1. Retake the quiz and submit again when you're ready.</div>`;
          }
        });
      });
    }

    function renderSidebar(){
      if (!sidebarMount) return;
      const phaseMarkup = currentView && portalData.phases[currentView] && currentView !== 'phase1' ? renderPhaseSidebar(currentView) : '';
      sidebarMount.innerHTML = `${renderGlobalNav()}${phaseMarkup}`;
      if (userBadge) {
        userBadge.style.display = currentView === 'dashboard' && currentUser ? 'block' : 'none';
      }
      bindSidebarEvents();
    }

    function savePortalViewState(){
      try {
        sessionStorage.setItem(PORTAL_VIEW_KEY, currentView || 'dashboard');
        sessionStorage.setItem(PORTAL_ITEM_KEY, currentItemId || '');
      } catch (error) {}
    }

    function restorePortalViewState(){
      try {
        const savedView = sessionStorage.getItem(PORTAL_VIEW_KEY);
        const savedItem = sessionStorage.getItem(PORTAL_ITEM_KEY);
        if (savedView) currentView = savedView;
        if (savedItem) currentItemId = savedItem;
      } catch (error) {}
    }

    function renderMain(){
      if (!mainMount) return;
      mainMount.innerHTML = renderPage(currentView);
      bindMainEvents();
    }

    function renderPortal(){
      portalWrap?.classList.toggle('is-dashboard-shell', currentView === 'dashboard');
      portal?.classList.toggle('dashboard-view', currentView === 'dashboard');
      portal?.classList.toggle('content-view', currentView !== 'dashboard');
      savePortalViewState();
      renderSidebar();
      renderMain();
    }

    window.showTemplate = function(viewKey, itemId){
      currentView = portalData.phases[viewKey] ? viewKey : viewKey;
      if (portalData.phases[currentView]) {
        currentPhaseKey = currentView;
        if (currentView === 'phase1') {
          currentItemId = itemId || currentItemId || 'phase1-1';
        } else {
          currentItemId = itemId || currentItemId || getPhaseItems(currentPhaseKey).find(item => item.type !== 'GATE')?.id || getPhaseItems(currentPhaseKey)[0]?.id || null;
        }
      } else if (viewKey === 'dashboard' || viewKey === 'resources' || viewKey === 'supervisor' || viewKey === 'support') {
        currentPhaseKey = currentPhaseKey || 'phase1';
        currentItemId = null;
      } else {
        currentView = 'dashboard';
        currentPhaseKey = 'phase1';
        currentItemId = null;
      }
      renderPortal();
      requestAnimationFrame(() => {
        mainMount?.querySelector('a, button, summary')?.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    };

    async function handleLogin(event){
      event.preventDefault();
      if (authError) authError.style.display = 'none';
      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';
      }

      const email = (loginEmail?.value || '').trim();
      const password = loginPassword?.value || '';

      try {
        const { data, error } = await srmaSupabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        setPortalUser(data.user);
        await loadPortalData();
        showPortal();
        restorePortalViewState();
        renderPortal();
      } catch (error) {
        if (authError) {
          authError.textContent = error?.message || 'Unable to sign in right now.';
          authError.style.display = 'block';
        }
      } finally {
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log in';
        }
      }
    }

    async function handleLogout(){
      await srmaSupabase.auth.signOut();
      clearPortalUser();
      showGate();
    }

    async function initSupabaseAuth(){
      const { data: sessionData } = await srmaSupabase.auth.getSession();
      const session = sessionData?.session;
      if (session?.user) {
        setPortalUser(session.user);
        await loadPortalData();
        restorePortalViewState();
        if (forceLoginEntry) {
          showGate();
        } else {
          showPortal();
          renderPortal();
        }
      } else {
        showGate();
      }

      srmaSupabase.auth.onAuthStateChange(async (_event, sessionState) => {
        if (sessionState?.user) {
          setPortalUser(sessionState.user);
          await loadPortalData();
          restorePortalViewState();
          showPortal();
          renderPortal();
        } else {
          clearPortalUser();
          try { sessionStorage.removeItem(PORTAL_VIEW_KEY); sessionStorage.removeItem(PORTAL_ITEM_KEY); } catch (error) {}
          showGate();
        }
      });
    }

    loginForm?.addEventListener('submit', handleLogin);
    if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);

    initSupabaseAuth();

    (function(){
      function ensureToggle(){
        if (window.innerWidth <= 900){
          if (!document.getElementById('sidebarToggle')){
            const btn = document.createElement('button');
            btn.id = 'sidebarToggle';
            btn.className = 'btn';
            btn.style.marginBottom = '10px';
            btn.textContent = 'Toggle menu';
            btn.setAttribute('aria-expanded', 'true');
            btn.addEventListener('click', ()=>{ sidebar.style.display = (sidebar.style.display === 'none') ? 'block' : 'none'; });
            const main = document.querySelector('.main');
            if (main) main.parentNode.insertBefore(btn, main);
          }
        } else {
          const t = document.getElementById('sidebarToggle');
          if (t) t.remove();
          sidebar.style.display = '';
        }
      }
      window.addEventListener('resize', ensureToggle);
      ensureToggle();
    })();
  </script>
</body>
</html>
